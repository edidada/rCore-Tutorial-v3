[package]
name = "os"
version = "0.1.0"
authors = ["Yifan Wu <shinbokuow@163.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
zero = "=0.1.2"
log = "=0.4.17"
riscv = { git = "https://github.com/rcore-os/riscv", rev = "11d43cf7cccb3b62a3caaf3e07a1db7449588f9a", features = ["inline-asm"] }
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
buddy_system_allocator = "0.6"
bitflags = "1.2.1"
xmas-elf = "0.7.0"

[features]
board_qemu = []
board_k210 = []
[build-dependencies]
regex = "=1.6.0"

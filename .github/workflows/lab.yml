name: aggregate lab experiments
on:
  push:
    branches: ['edidada/lab']
  pull_request:
    branches: ['edidada/lab']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usertests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and QEMU
        run: |
          rustup target add riscv64gc-unknown-none-elf
          sudo apt-get update
          sudo apt-get install -y binutils-riscv64-unknown-elf qemu-system-misc
      - name: Build and run all usertests
        run: bash scripts/ci-build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aggregate-lab
          path: |
            ci-logs/
            os/target/riscv64gc-unknown-none-elf/release/os*
            os/Cargo.lock
            user/Cargo.lock
            easy-fs-fuse/Cargo.lock
